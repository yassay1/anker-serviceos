[project]
name = "serviceos-api"
version = "0.1.0"
description = "Anker ServiceOS V1 API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.20,<1.21",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<1",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0.54,<2.1",
  "uvicorn>=0.30,<1",
  "boto3>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["serviceos_api*"]

[tool.setuptools.package-data]
serviceos_api = ["knowledge/*.md", "knowledge/corpus/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
