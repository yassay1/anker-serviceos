worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not log URLs, queries, IPs, cookies, referrers or Authorization.
    log_format serviceos '$time_iso8601 status=$status method=$request_method '
                         'bytes=$body_bytes_sent duration=$request_time request_id=$request_id';
    access_log /dev/stdout serviceos;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 12m;
    client_body_timeout 60s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Re-resolve a recreated API container rather than retaining its old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/conf.d/*.conf;
}
