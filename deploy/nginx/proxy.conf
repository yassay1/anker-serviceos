# Included inside /api/; keep the original URI, including SSE cursors.
set $api_upstream http://api:8000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
# Neither client-supplied nor proxy-derived forwarded identity is trusted.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Request-ID $request_id;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
gzip off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
send_timeout 3600s;
# Never retry a business write against another upstream.
proxy_next_upstream off;
# Nginx error records can contain raw request URLs; API failures are observed
# through redacted application logs and the metadata-only access log above.
error_log /dev/null crit;
