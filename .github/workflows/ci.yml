name: Baseline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: serviceos_ci
          POSTGRES_USER: serviceos_ci
          POSTGRES_PASSWORD: serviceos_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviceos_ci -d serviceos_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.12.5
      - run: uv sync --project backend --locked
      - run: uv run --project backend --locked pytest backend/tests --require-postgres
        env:
          SERVICEOS_TEST_DATABASE_URL: postgresql+psycopg://serviceos_ci:serviceos_ci_only@127.0.0.1:5432/serviceos_ci
      - run: uv run --project backend --locked python -m serviceos_api.export_openapi --check
      - run: uv run --project backend --locked python contracts/proposed/v1/sync_implemented.py --check
      - run: npm ci
        working-directory: frontend
      - run: npm exec -- openapi-typescript ../contracts/proposed/v1/openapi.yaml -o /tmp/serviceos-proposed-v1.d.ts
        working-directory: frontend
      - run: npm run check:api
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm exec -- playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - name: Prepare isolated database for live browser regression
        run: |
          uv run --project backend --locked python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ['SERVICEOS_DATABASE_URL'])
          assert url.host == '127.0.0.1' and url.database == 'serviceos_dev' and url.username == 'serviceos_ci'
          engine = create_engine(url.set(database='postgres'), isolation_level='AUTOCOMMIT', hide_parameters=True)
          with engine.connect() as connection:
              connection.execute(text('CREATE DATABASE serviceos_dev'))
          engine.dispose()
          PY
          uv run --project backend --locked alembic -c backend/alembic.ini upgrade head
          uv run --project backend --locked python -m serviceos_api.bootstrap_local
        env:
          SERVICEOS_DATABASE_URL: postgresql+psycopg://serviceos_ci:serviceos_ci_only@127.0.0.1:5432/serviceos_dev
          SERVICEOS_ENV: development
          SERVICEOS_AUTH_MODE: local
          SERVICEOS_LOCAL_AUTH_PASSWORD: serviceos_ci_only
      - run: npm run test:live
        working-directory: frontend
        env:
          SERVICEOS_DATABASE_URL: postgresql+psycopg://serviceos_ci:serviceos_ci_only@127.0.0.1:5432/serviceos_dev
          SERVICEOS_ENV: development
          SERVICEOS_AUTH_MODE: local
          SERVICEOS_LOCAL_AUTH_PASSWORD: serviceos_ci_only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          path: frontend/test-results/
          retention-days: 7
