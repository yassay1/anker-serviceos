components:
  schemas:
    ActorRead:
      additionalProperties: false
      properties:
        actor_id:
          format: uuid
          title: Actor Id
          type: string
        display_name:
          title: Display Name
          type: string
        kind:
          enum:
          - CUSTOMER
          - STAFF
          title: Kind
          type: string
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        tenant_id:
          format: uuid
          title: Tenant Id
          type: string
      required:
      - tenant_id
      - actor_id
      - kind
      - display_name
      title: ActorRead
      type: object
    AssistanceRequest:
      additionalProperties: false
      properties:
        case_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Case Id
        reason:
          maxLength: 1000
          minLength: 3
          title: Reason
          type: string
      required:
      - reason
      title: AssistanceRequest
      type: object
    AttachConversation:
      additionalProperties: false
      properties:
        conversation_id:
          format: uuid
          title: Conversation Id
          type: string
        expected_version:
          minimum: 1.0
          title: Expected Version
          type: integer
      required:
      - conversation_id
      - expected_version
      title: AttachConversation
      type: object
    AttachDevice:
      additionalProperties: false
      properties:
        device_id:
          format: uuid
          title: Device Id
          type: string
        expected_version:
          minimum: 1.0
          title: Expected Version
          type: integer
        is_primary:
          default: false
          title: Is Primary
          type: boolean
        role:
          default: AFFECTED
          maxLength: 32
          minLength: 1
          title: Role
          type: string
      required:
      - device_id
      - expected_version
      title: AttachDevice
      type: object
    CandidateFact:
      additionalProperties: false
      properties:
        expected_device_revision:
          minimum: 1.0
          title: Expected Device Revision
          type: integer
        fact_key:
          maxLength: 120
          minLength: 2
          pattern: ^[a-z][a-z0-9_]*$
          title: Fact Key
          type: string
        value:
          title: Value
      required:
      - expected_device_revision
      - fact_key
      - value
      title: CandidateFact
      type: object
    CaseRead:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        customer_id:
          format: uuid
          title: Customer Id
          type: string
        id:
          format: uuid
          title: Id
          type: string
        problem_text:
          title: Problem Text
          type: string
        status:
          title: Status
          type: string
        user_goal:
          anyOf:
          - type: string
          - type: 'null'
          title: User Goal
        version:
          title: Version
          type: integer
      required:
      - id
      - customer_id
      - problem_text
      - user_goal
      - status
      - version
      - created_at
      title: CaseRead
      type: object
    ClaimTask:
      additionalProperties: false
      properties:
        expected_version:
          minimum: 1.0
          title: Expected Version
          type: integer
      required:
      - expected_version
      title: ClaimTask
      type: object
    ConversationList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ConversationRead'
          title: Items
          type: array
      required:
      - items
      title: ConversationList
      type: object
    ConversationRead:
      additionalProperties: false
      properties:
        collaboration_mode:
          title: Collaboration Mode
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        customer_id:
          format: uuid
          title: Customer Id
          type: string
        id:
          format: uuid
          title: Id
          type: string
        reply_policy:
          title: Reply Policy
          type: string
        status:
          title: Status
          type: string
        version:
          title: Version
          type: integer
      required:
      - id
      - customer_id
      - status
      - collaboration_mode
      - reply_policy
      - version
      - created_at
      title: ConversationRead
      type: object
    CreateCase:
      additionalProperties: false
      properties:
        customer_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Customer Id
        problem_text:
          maxLength: 8000
          minLength: 1
          title: Problem Text
          type: string
        user_goal:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: User Goal
      required:
      - problem_text
      title: CreateCase
      type: object
