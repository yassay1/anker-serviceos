        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Authorized evidence
          oldest first: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedEvidencePage'
        '401':
          description: Not authenticated
        '404':
          description: Case not found or hidden
    post:
      operationId: upload_case_evidence
      summary: Persist image evidence and queue safety inspection
      tags:
      - evidence
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Customer owns case; staff belongs to tenant. Agent cannot upload on behalf of customer.
      x-serviceos-idempotency: Same client_evidence_id and file digest returns original receipt; different digest
        returns 409.
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - client_evidence_id
              - expected_case_version
              - file
              properties:
                client_evidence_id:
                  type: string
                  format: uuid
                expected_case_version:
                  type: integer
                  minimum: 1
                visibility:
                  type: string
                  enum:
                  - PUBLIC
                  - INTERNAL
                  default: PUBLIC
                file:
                  type: string
                  format: binary
                  description: JPEG
                  PNG or WebP; at most 10 MiB: null
      responses:
        '202':
          description: Stored; inspection is pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedEvidenceRead'
        '401':
          description: Not authenticated
        '403':
          description: Actor cannot upload evidence
        '404':
          description: Case not found or hidden
        '409':
          description: Stale case version or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposedError'
        '413':
          description: File exceeds size limit
        '415':
          description: Unsupported media type
        '422':
          description: Invalid metadata or unsafe file
        '503':
          description: Storage or inspection unavailable
