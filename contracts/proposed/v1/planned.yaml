# Design source for operations not yet registered by FastAPI.
# sync_implemented.py combines this with contracts/openapi.json.
paths:
  /api/v1/cases/{id}/tasks:
    get:
      operationId: list_case_tasks
      summary: List tasks linked to a case
      tags: [collaboration]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Staff in tenant; customer receives only public task projection.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized tasks, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProposedCaseTaskRead'}}}}}
        '401': {description: Not authenticated}
        '404': {description: Case not found or hidden}
  /api/v1/agent-runs/{id}:
    get:
      operationId: read_agent_run
      summary: Read staff-safe Agent run status
      tags: [agent-runs]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Authorized staff only; exclude raw prompts, reasoning, tool arguments and secrets.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Sanitized run status, content: {application/json: {schema: {$ref: '#/components/schemas/ProposedAgentRunRead'}}}}
        '401': {description: Not authenticated}
        '403': {description: Staff role required}
        '404': {description: Run not found or hidden}
  /api/v1/cases/{id}/verifications:
    get:
      operationId: list_case_verifications
      summary: Read recorded outcome checks
      tags: [verifications]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Customer sees own public checks; staff sees authorized case checks.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized checks, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProposedVerificationRead'}}}}}
        '401': {description: Not authenticated}
        '404': {description: Case not found or hidden}
    post:
      operationId: record_case_verification
      summary: Record observed outcome; server decides whether case can be resolved
      tags: [verifications]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Case customer or authorized staff; evidence refs must belong to case and be visible.
      x-serviceos-idempotency: Same client_verification_id and payload replays result; changed payload returns 409.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProposedVerificationRequest'}}}
      responses:
        '201': {description: Observation stored; case status comes from current Rule, content: {application/json: {schema: {$ref: '#/components/schemas/ProposedVerificationRead'}}}}
        '401': {description: Not authenticated}
        '404': {description: Case or evidence hidden}
        '409': {description: Stale case version or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ProposedError'}}}}
        '422': {description: Invalid observation}
  /api/v1/cases/{id}/resolution-contract:
    get:
      operationId: read_case_resolution_contract
      summary: Read the frozen conditions used to judge a resolution
      tags: [verifications]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Case customer sees public conditions; staff sees authorized case conditions.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized resolution conditions, content: {application/json: {schema: {$ref: '#/components/schemas/ProposedResolutionContractRead'}}}}
        '401': {description: Not authenticated}
        '404': {description: Case or contract not found or hidden}
  /api/v1/cases/{id}/follow-up-consents:
    get:
      operationId: list_case_follow_up_consents
      summary: List explicit follow-up consent records
      tags: [follow-ups]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Customer sees own consent; authorized staff sees case consent.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized consents, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProposedFollowUpConsentRead'}}}}}
        '401': {description: Not authenticated}
        '404': {description: Case not found or hidden}
    post:
      operationId: record_case_follow_up_consent
      summary: Record explicit customer consent before scheduling follow-up
      tags: [follow-ups]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Case customer only; staff cannot manufacture customer consent.
      x-serviceos-idempotency: Same client_consent_id and payload replays consent; changed payload returns 409.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProposedFollowUpConsentRequest'}}}
      responses:
        '201': {description: Consent persisted, content: {application/json: {schema: {$ref: '#/components/schemas/ProposedFollowUpConsentRead'}}}}
        '401': {description: Not authenticated}
        '403': {description: Customer role or ownership missing}
        '404': {description: Case not found or hidden}
        '409': {description: Stale case version or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ProposedError'}}}}
        '422': {description: Invalid consent}
  /api/v1/cases/{id}/follow-ups:
    get:
      operationId: list_case_follow_ups
      summary: Read consented follow-up jobs
      tags: [follow-ups]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Case customer or authorized staff; internal instructions remain staff only.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Authorized follow-ups, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProposedFollowUpRead'}}}}}
        '401': {description: Not authenticated}
        '404': {description: Case not found or hidden}
    post:
      operationId: schedule_case_follow_up
      summary: Schedule a follow-up only with recorded customer consent
      tags: [follow-ups]
      x-serviceos-status: planned
      x-serviceos-stage: 4
      x-serviceos-authorization: Authorized staff; consent reference must belong to this case and customer.
      x-serviceos-idempotency: Same client_follow_up_id and payload returns original job; changed payload returns 409.
      security: [{SessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProposedFollowUpRequest'}}}
      responses:
        '201': {description: Follow-up persisted, content: {application/json: {schema: {$ref: '#/components/schemas/ProposedFollowUpRead'}}}}
        '401': {description: Not authenticated}
        '403': {description: Staff role or valid consent missing}
        '404': {description: Case or consent hidden}
        '409': {description: Stale case version or idempotency conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ProposedError'}}}}
        '422': {description: Invalid schedule}

components:
  schemas:
    ProposedError:
      type: object
      additionalProperties: false
      required: [code, detail]
      properties:
        code: {type: string, description: Stable application error code}
        detail: {type: string, description: Safe user-facing explanation}
        current_version: {type: integer, minimum: 1}
    ProposedCaseTaskRead:
      type: object
      additionalProperties: false
      required: [id, case_id, status, reason, version]
      properties:
        id: {type: string, format: uuid}
        case_id: {type: string, format: uuid}
        status: {type: string, enum: [OPEN, ASSIGNED, CLOSED]}
        reason: {type: string}
        version: {type: integer, minimum: 1}
        assignee_id: {type: [string, 'null'], format: uuid}
    ProposedAgentRunRead:
      type: object
      additionalProperties: false
      required: [id, conversation_id, status, started_at]
      properties:
        id: {type: string, format: uuid}
        conversation_id: {type: string, format: uuid}
        related_case_id: {type: [string, 'null'], format: uuid}
        status: {type: string, enum: [RUNNING, WAITING_APPROVAL, COMPLETED, FAILED, CANCELLED]}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        error_code: {type: [string, 'null']}
    ProposedActionRequest:
      type: object
      additionalProperties: false
      required: [client_action_id, expected_case_version, action_kind, reason]
      properties:
        client_action_id: {type: string, format: uuid}
        expected_case_version: {type: integer, minimum: 1}
        action_kind: {type: string, enum: [MOCK_SERVICE_REQUEST]}
        source_proposal_id: {type: [string, 'null'], format: uuid}
        reason: {type: string, minLength: 3, maxLength: 1000}
    ProposedMockReceipt:
      type: object
      additionalProperties: false
      required: [adapter, external_reference, result, received_at]
      properties:
        adapter: {type: string, enum: [MOCK]}
        external_reference: {type: string}
        result: {type: string, enum: [SUCCEEDED, FAILED]}
        received_at: {type: string, format: date-time}
    ProposedActionRead:
      type: object
      additionalProperties: false
      required: [id, case_id, action_kind, adapter, status, version, created_at]
      properties:
        id: {type: string, format: uuid}
        case_id: {type: string, format: uuid}
        action_kind: {type: string, enum: [MOCK_SERVICE_REQUEST]}
        adapter: {type: string, enum: [MOCK]}
        status: {type: string, enum: [PROPOSED, WAITING_APPROVAL, APPROVED, EXECUTING, SUCCEEDED, FAILED, UNKNOWN]}
        version: {type: integer, minimum: 1}
        approval_id: {type: [string, 'null'], format: uuid}
        receipt: {anyOf: [{$ref: '#/components/schemas/ProposedMockReceipt'}, {type: 'null'}]}
        created_at: {type: string, format: date-time}
    ProposedApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision_id, expected_version, decision, reason]
      properties:
        decision_id: {type: string, format: uuid}
        expected_version: {type: integer, minimum: 1}
        decision: {type: string, enum: [APPROVED, REJECTED]}
        reason: {type: string, minLength: 3, maxLength: 1000}
    ProposedApprovalRead:
      type: object
      additionalProperties: false
      required: [id, action_id, status, version]
      properties:
        id: {type: string, format: uuid}
        action_id: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED]}
        version: {type: integer, minimum: 1}
        decided_at: {type: [string, 'null'], format: date-time}
    ProposedVerificationRequest:
      type: object
      additionalProperties: false
      required: [client_verification_id, expected_case_version, expected_resolution_contract_version, observed_result, note]
      properties:
        client_verification_id: {type: string, format: uuid}
        expected_case_version: {type: integer, minimum: 1}
        expected_resolution_contract_version: {type: integer, minimum: 1}
        observed_result: {type: string, enum: [WORKING, NOT_WORKING, UNCERTAIN]}
        evidence_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}}
        note: {type: string, maxLength: 2000}
    ProposedVerificationRead:
      type: object
      additionalProperties: false
      required: [id, case_id, observed_result, decision, created_at]
      properties:
        id: {type: string, format: uuid}
        case_id: {type: string, format: uuid}
        observed_result: {type: string, enum: [WORKING, NOT_WORKING, UNCERTAIN]}
        decision: {type: string, enum: [PENDING, VERIFIED_RESOLVED, NOT_RESOLVED]}
        case_status: {type: string, enum: [OPEN, IN_PROGRESS, WAITING_CUSTOMER, WAITING_EXTERNAL, RESOLVED, CLOSED]}
        created_at: {type: string, format: date-time}
    ProposedResolutionContractRead:
      type: object
      additionalProperties: false
      required: [id, case_id, version, conditions, created_at]
      properties:
        id: {type: string, format: uuid}
        case_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        conditions: {type: array, minItems: 1, items: {type: string}}
        created_at: {type: string, format: date-time}
    ProposedFollowUpConsentRequest:
      type: object
      additionalProperties: false
      required: [client_consent_id, expected_case_version, purpose]
      properties:
        client_consent_id: {type: string, format: uuid}
        expected_case_version: {type: integer, minimum: 1}
        purpose: {type: string, minLength: 3, maxLength: 1000}
    ProposedFollowUpConsentRead:
      type: object
      additionalProperties: false
      required: [id, case_id, customer_id, purpose, created_at]
      properties:
        id: {type: string, format: uuid}
        case_id: {type: string, format: uuid}
        customer_id: {type: string, format: uuid}
        purpose: {type: string}
        created_at: {type: string, format: date-time}
    ProposedFollowUpRequest:
      type: object
      additionalProperties: false
      required: [client_follow_up_id, expected_case_version, consent_record_id, due_at, purpose]
      properties:
        client_follow_up_id: {type: string, format: uuid}
        expected_case_version: {type: integer, minimum: 1}
        consent_record_id: {type: string, format: uuid}
        due_at: {type: string, format: date-time}
        purpose: {type: string, minLength: 3, maxLength: 1000}
    ProposedFollowUpRead:
      type: object
      additionalProperties: false
      required: [id, case_id, status, due_at, purpose, created_at]
      properties:
        id: {type: string, format: uuid}
        case_id: {type: string, format: uuid}
        status: {type: string, enum: [SCHEDULED, RUNNING, COMPLETED, CANCELLED, FAILED]}
        due_at: {type: string, format: date-time}
        purpose: {type: string}
        created_at: {type: string, format: date-time}
